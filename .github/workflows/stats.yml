# Print play statistics into the job log, on demand.
#
# Exists because a Claude session cannot reach Supabase: the sandbox's agent
# proxy refuses the CONNECT outright, so the only way for one to see play data
# is to have Actions fetch it and read the log afterwards. Nothing is written
# and nothing is committed — this is a read-only window onto the database.
#
# results is the single table the public anon key may read; events (and so
# feedback) stays service-role only, and this workflow does not change that.
name: stats
on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Topic popularity
        run: |
          set -euo pipefail
          SUPA="https://kyraqgmumfdxvcplwqge.supabase.co"
          KEY=$(grep -o 'SUPABASE_ANON_KEY: "[^"]*"' config.js | cut -d'"' -f2)
          curl -sS --fail --retry 3 --retry-delay 5 \
            "$SUPA/rest/v1/results?select=player_name,day,combo_key,seconds,hints,assisted&order=day.desc&limit=5000" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /tmp/results.json
          python3 tools/topic_stats.py /tmp/results.json menu
