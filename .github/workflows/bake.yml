# Bake, gate, stage and verify the next few days — no Claude session involved.
#
# All the logic lives in the content repo's pipeline/daily_update.py, which is
# the same entry point the Claude routines call. This file only clones, runs
# it, and lets its exit code colour the run. Every rule that used to be inline
# here (the freshness gate, the discard, the staging check) moved into that
# script after each of them was found missing from at least one of the four
# callers that hand-sequenced the steps.
#
# A red run means one of two things, and the log's last lines say which:
#  - the library has no fresh words for a day (a content signal — author
#    topics/words; the Claude content runs at 00:10 and 05:20 do this), or
#  - a mechanical step failed (bake, verify, push, or remote-staging mismatch).
#
# 06:12 gives the whole day to react; 20:12 catches anything authored during
# the day. runway-check.yml at 19:07 stays as an independent alarm on purpose:
# the detector should not share a failure domain with the actor.
name: bake
on:
  schedule:
    - cron: "12 6 * * *"
    - cron: "12 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bake and verify, but push nothing"
        type: boolean
        default: true
      runway_days:
        description: "How many days ahead to keep baked"
        type: string
        default: "3"
      max_repeat_pct:
        description: "Reject a day serving more than this % already-seen answers"
        type: string
        default: "5"

permissions:
  contents: write

concurrency:
  group: trivium-publish        # never race the release or the digest
  cancel-in-progress: false

env:
  BRANCH: claude/ai-crossword-generator-research-2iemh5
  RUNWAY_DAYS: ${{ inputs.runway_days || '3' }}
  MAX_REPEAT_PCT: ${{ inputs.max_repeat_pct || '5' }}

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the content repo
        env:
          TOKEN: ${{ secrets.GREYHOUND2_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::GREYHOUND2_TOKEN is not set — add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          git clone --quiet --branch "$BRANCH" --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/jwghopkins-lab/greyhound2.git" gh2
          echo "cloned $BRANCH at $(git -C gh2 rev-parse --short HEAD)"

      - name: Daily update
        run: |
          set -euo pipefail
          git config user.name  "TRIVIUM bake"
          git config user.email "noreply@anthropic.com"
          PUSH="--push"
          if [ "${{ inputs.dry_run }}" = "true" ]; then PUSH=""; fi
          python3 gh2/poc/crossword/pipeline/daily_update.py \
            --days "$RUNWAY_DAYS" --max-repeat "$MAX_REPEAT_PCT" \
            --trivium "$GITHUB_WORKSPACE" $PUSH
